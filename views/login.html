<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Admin Login | Merit Pools</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:linear-gradient(140deg,#1497d4,#0a2e57 55%,#061d38);padding:16px}
form{background:#fff;border-radius:20px;padding:36px;width:min(380px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
h1{margin:0 0 4px;color:#0a2e57;font-size:1.5rem}p{margin:0 0 22px;color:#5a6b80}
label{display:block;font-weight:600;font-size:.85rem;color:#0a2e57;margin:0 0 6px}
input{width:100%;box-sizing:border-box;font:inherit;padding:.75em .9em;border:1.5px solid #dbe8f0;border-radius:10px;margin-bottom:14px}
button{width:100%;padding:.9em;border:0;border-radius:999px;background:#d42a2f;color:#fff;font-weight:700;font:inherit;font-weight:700;cursor:pointer}
.err{display:none;color:#d42a2f;font-weight:600;margin-bottom:12px}
</style></head>
<body>
<form method="post" action="/admin/login">
  <h1>Merit Pools</h1><p>Lead dashboard sign-in</p>
  <div class="err" id="err">Incorrect password.</div>
  <label for="p">Password</label><input id="p" name="password" type="password" autofocus autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
<script>if(location.search.includes('error'))document.getElementById('err').style.display='block'</script>
</body></html>
